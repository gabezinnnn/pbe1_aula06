<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventário</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header></header>
    <main>
        <section class="cadastrar">
            <form action="http://localhost:3000/bens" method="post">
                <input type="text" name="item" placeholder="Nome do Item" required><br>
                <input type="text" name="local" placeholder="Local do Item" required><br>
                <input type="date" name="data" required><br>
                <input type="number" name="valor" placeholder="Valor do Item" required><br>
                <input type="text" name="patrimonio" placeholder="Número do Patrimônio" required><br>
                <button type="submit">Enviar</button>
            </form>
        </section>
        <section class="listar">
            <table>
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Local</th>
                        <th>Data</th>
                        <th>Valor</th>
                        <th>Patrimônio</th>
                    </tr>
                </thead>
                <tbody id="tabela">
                    <script>
                        fetch("http://localhost:3000/bens")
                            .then(resp => resp.json())
                            .then(resp => {
                                resp.forEach(pat => {
                                    const linha = document.createElement("tr")
                                    linha.innerHTML = `
                                    <td>${pat.item}</td>
                                    <td>${pat.local}</td>
                                    <td>${pat.data}</td>
                                    <td>${pat.valor}</td>
                                    <td>${pat.patrimonio}</td>
                                `
                                    tabela.appendChild(linha)
                                });
                            })
                    </script>
                </tbody>
            </table>
        </section>
        <footer>
            <h6>By Gabezinnnn</h6>
        </footer>
    </main>
</body>

</html>
